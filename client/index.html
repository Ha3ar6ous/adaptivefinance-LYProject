<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Financial clarity for gig workers and independent earners. Understand your income outlook, financial health, and the next steps toward a stronger safety net." />
    <meta name="theme-color" content="#153c2b" />
    <title>Adaptive Finance</title>
  </head>
  <body>
    <!-- Hidden container for Google Translate script to hook into -->
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        window.googleTranslateElementInit = function() {
          if (typeof window.google?.translate?.TranslateElement === 'function' && document.getElementById('google_translate_element') && document.getElementById('google_translate_element').innerHTML === '') {
            new google.translate.TranslateElement(
              {
                pageLanguage: 'en',
                includedLanguages: 'en,hi,bn,te,mr,ta,gu,kn,ml,pa',
                autoDisplay: false
              }, 
              'google_translate_element'
            );
          }
        };
        window.googleTranslateElementInit();
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <style>
      /* Completely hide the Google Translate widget and all its popups/banners */
      #google_translate_element {
        display: none !important;
      }
      .goog-te-banner-frame {
        display: none !important;
      }
      .goog-logo-link {
        display: none !important;
      }
      .goog-te-gadget {
        color: transparent !important;
      }
      #goog-gt-tt, .goog-te-balloon-frame {
        display: none !important;
      }
      /* Prevent the push-down effect */
      body, html {
        top: 0px !important; 
        position: static !important;
      }
    </style>
  </body>
</html>
